<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members Directory | Jordanian Society of American Medical Graduates (JSAMG)</title>
  <meta name="description" content="Searchable directory of JSAMG physician members. دليل أعضاء جمعية الأطباء خريجي الولايات المتحدة الأمريكية.">
  <meta name="theme-color" content="#0b2a5b">
  <link rel="icon" type="image/png" href="images/logo/favicon-64.png">
  <link rel="apple-touch-icon" href="images/logo/apple-touch-icon.png">
  <meta property="og:title" content="Members Directory | Jordanian Society of American Medical Graduates (JSAMG)">
  <meta property="og:description" content="Searchable directory of JSAMG physician members. دليل أعضاء جمعية الأطباء خريجي الولايات المتحدة الأمريكية.">
  <meta property="og:image" content="images/logo/jsamg-logo.jpg">
  <meta property="og:site_name" content="Jordanian Society of American Medical Graduates (JSAMG)">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/members-directory.css">
</head>
<body data-page="members">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow" data-i18n="membersPage.eyebrow"></p>
        <h1 data-i18n="membersPage.title"></h1>
        <p class="lead" data-i18n="membersPage.lead"></p>
      </div>
    </section>

    <section class="section tight" id="members-directory">
      <div class="container">
        <!-- The search box, filters and member cards are built by js/members-directory.js
             from the data in data/members.json. Nothing needs to be edited here. -->
        <div id="md-controls" class="md-controls"></div>
        <div id="md-count" class="md-count" aria-live="polite"></div>
        <div id="md-grid" class="md-grid"></div>
        <p class="md-note small muted" data-i18n="membersPage.consentNote"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="data/site-text.js"></script>
  <script src="data/events.js"></script>
  <script src="data/board.js"></script>
  <script src="data/news.js"></script>
  <script src="data/gallery.js"></script>
  <script src="data/contact.js"></script>
  <script src="data/text-members.js"></script>
  <script src="js/members-directory.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
