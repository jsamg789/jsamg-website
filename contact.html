<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Jordanian Society of American Medical Graduates (JSAMG)</title>
  <meta name="description" content="Contact the Jordanian Society of American Medical Graduates: info.jsamg@gmail.com. اتصل بنا.">
  <meta name="theme-color" content="#0b2a5b">
  <link rel="icon" type="image/png" href="images/logo/favicon-64.png">
  <link rel="apple-touch-icon" href="images/logo/apple-touch-icon.png">
  <meta property="og:title" content="Contact Us | Jordanian Society of American Medical Graduates (JSAMG)">
  <meta property="og:description" content="Contact the Jordanian Society of American Medical Graduates: info.jsamg@gmail.com. اتصل بنا.">
  <meta property="og:image" content="images/logo/jsamg-logo.jpg">
  <meta property="og:site_name" content="Jordanian Society of American Medical Graduates (JSAMG)">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow" data-i18n="contactPage.eyebrow"></p>
        <h1 data-i18n="contactPage.title"></h1>
        <p class="lead" data-i18n="contactPage.lead"></p>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="contact-hero-card">
          <h2 data-i18n="contact.emailLabel"></h2>
          <a class="email-link" data-email href="mailto:info.jsamg@gmail.com">info.jsamg@gmail.com</a>
          <p data-i18n="contactPage.emailNote"></p>
        </div>

        <div class="contact-actions">
          <div class="info-card">
            <h2 data-i18n="contactPage.membershipTitle"></h2>
            <p data-i18n="contactPage.membershipBody"></p>
            <a class="btn btn-burgundy" data-mailto="membership" href="#" data-i18n="contactPage.membershipButton"></a>
          </div>
          <div class="info-card">
            <h2 data-i18n="contactPage.generalTitle"></h2>
            <p data-i18n="contactPage.generalBody"></p>
            <a class="btn btn-navy" data-mailto="general" href="#" data-i18n="contactPage.generalButton"></a>
          </div>
        </div>

        <div class="contact-extra" id="contact-extra" hidden></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="data/site-text.js"></script>
  <script src="data/events.js"></script>
  <script src="data/board.js"></script>
  <script src="data/news.js"></script>
  <script src="data/gallery.js"></script>
  <script src="data/contact.js"></script>
  <script src="data/text-contact.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
